<style>

.stage{position:relative;width:100%;height:100vh;overflow:hidden;background:linear-gradient(#121633,#2B2659);container-type:inline-size}

<body>

    <g id="s7segs" fill="none" stroke="#F2B544" stroke-width="3" stroke-linecap="round"></g>

  <text id="s7title" x="640" y="118" text-anchor="middle" class="serif" font-size="60" fill="#ECE8F6">Always more to learn</text>
  <text id="s7sub" x="640" y="164" text-anchor="middle" class="serif" font-style="italic" font-size="25" fill="#A6A2C4">And I keep learning, every day.</text>
</g>

</div>
</div>

</main>

<script>
(() => {
  // Helpers
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  function S(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
  const lin = (t, a, b) => clamp((t - a) / (b - a));
  const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const back = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const seg = (t, a, b) => ease(lin(t, a, b));
  const lerp = (a, b, k) => a + (b - a) * k;
  const op = (el, v) => { el.style.opacity = v; };
  const tr = (el, s) => el.setAttribute('transform', s);
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function prepDraw(el) { const L = el.getTotalLength(); el._L = L; el.style.strokeDasharray = L + ' ' + L; el.style.strokeDashoffset = L; }
  function draw(el, k) { el.style.strokeDashoffset = el._L * (1 - k); }
  const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  function mix(a, b, k) { const A = hex(a), B = hex(b); return 'rgb(' + A.map((v, i) => Math.round(v + (B[i] - v) * k)).join(',') + ')'; }

  const nb = l => l.replace(/ /g, '\u00A0');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Stars
  const stars = [];
  (() => {
    const R = rng(7);
    for (let i = 0; i < 120; i++) {
      const c = S('circle', { cx: (R() * 1280).toFixed(1), cy: (R() * 560).toFixed(1), r: (R() * 1.4 + .4).toFixed(2), fill: '#ECE8F6' }, $('stars'));
      stars.push({ c, ph: R() * 6.28, sp: .6 + R() * 1.6, base: .2 + R() * .45 });
    }
  })();
  function renderStars(t) {
    for (const s of stars) op(s.c, s.base * (reduceMotion ? 1 : (.6 + .4 * Math.sin(t * s.sp + s.ph))));
  }

  // Scene 1: curiosity
  const s1 = { glyphs: [] };
  function init1() {
    const G = [['?', 420, 170], ['?', 930, 150], ['{ }', 300, 260], ['01', 1040, 250], ['?', 560, 110], ['</>', 820, 90], ['?', 1120, 150], ['#', 220, 150]];
    G.forEach(([ch, x, y]) => {
      const el = S('text', { 'text-anchor': 'middle' }, $('s1glyphs'));
      el.textContent = ch;
      s1.glyphs.push({ el, x, y });
    });
  }
  function render1(lt) {
    const fadeTitle = 1 - seg(lt, 3, 3.8);
    op($('s1title'), seg(lt, .2, 1.2) * fadeTitle);
    op($('s1sub'), seg(lt, .6, 1.6) * fadeTitle);
    const m = seg(lt, .6, 1.6);
    op($('s1mon'), m); tr($('s1mon'), `translate(0 ${24 * (1 - m)})`);
    op($('s1kid'), seg(lt, 1, 2));
    const scr = $('s1screen');
    op(scr, lt > 1.8 ? 1 : 0);
    const sy = .02 + .98 * easeOut(lin(lt, 1.8, 2.3));
    tr(scr, `translate(0 380) scale(1 ${sy}) translate(0 -380)`);
    op($('s1glow'), seg(lt, 2, 3) * (.75 + .08 * Math.sin(lt * 7)));
    op($('s1led'), lt > 1.8 ? 1 : .2);

    const L1 = 'C:\\> hello?', L2 = 'how do you work?';
    const l1 = $('s1l1'), l2 = $('s1l2');
    l1.textContent = L1.slice(0, Math.floor(lin(lt, 3, 4.2) * L1.length));
    l2.textContent = L2.slice(0, Math.floor(lin(lt, 4.6, 6) * L2.length));
    const onL2 = lt >= 4.6;
    const cur = $('s1cur'), el = onL2 ? l2 : l1;
    const w = el.textContent ? el.getComputedTextLength() : 0;
    cur.setAttribute('x', 598 + w + 2);
    cur.setAttribute('y', onL2 ? 357 : 330);
    const typing = (lt > 3 && lt < 4.2) || (lt > 4.6 && lt < 6);
    op(cur, lt > 2.3 && (typing || Math.floor(lt * 2.4) % 2 === 0) ? 1 : 0);

    s1.glyphs.forEach((g, i) => {
      const k = lin(lt, 5.2 + i * .35, 7.8 + i * .35);
      const e = easeOut(k);
      g.el.setAttribute('x', lerp(680, g.x, e));
      g.el.setAttribute('y', lerp(380, g.y, e));
      op(g.el, k > 0 ? Math.min(1, k * 5) * .85 : 0);
    });
  }

  // Scene 2: inside the machine
  const s2 = {};
  function init2() {
    const root = $('s2');
    const D = ['M740,280 H860 V200 H990', 'M740,380 H880 V470 H1000', 'M540,280 H420 V200 H290', 'M540,380 H400 V470 H280', 'M640,230 V120', 'M640,430 V520'];
    const END = [[990, 200], [1000, 470], [290, 200], [280, 470], [640, 120], [640, 520]];
    const LAB = [['Registers', 1006, 207, 'start'], ['Memory', 1016, 477, 'start'], ['ALU', 274, 207, 'end'], ['Clock', 264, 477, 'end'], ['Fetch, decode, execute', 640, 100, 'middle'], ['Bus', 640, 552, 'middle']];
    const gT = S('g', { fill: 'none', stroke: '#4A4680', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, root);
    const gP = S('g', { fill: 'none', stroke: '#F2B544', 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, root);
    s2.traces = D.map(d => { const p = S('path', { d }, gT); prepDraw(p); return p; });
    s2.pulses = D.map(d => { const p = S('path', { d }, gP); p._L = p.getTotalLength(); p.style.strokeDasharray = `24 ${p._L + 24}`; return p; });
    s2.ends = END.map(([x, y]) => S('circle', { cx: x, cy: y, r: 7, fill: '#F2B544' }, root));
    s2.pins = S('g', { fill: '#7FD6E6', opacity: .7 }, root);
    for (let i = 0; i < 6; i++) {
      const a = 565 + i * 30, b = 255 + i * 30;
      S('rect', { x: a - 4, y: 216, width: 8, height: 14 }, s2.pins);
      S('rect', { x: a - 4, y: 430, width: 8, height: 14 }, s2.pins);
      S('rect', { x: 526, y: b - 4, width: 14, height: 8 }, s2.pins);
      S('rect', { x: 740, y: b - 4, width: 14, height: 8 }, s2.pins);
    }
    s2.body = S('rect', { x: 540, y: 230, width: 200, height: 200, rx: 16, fill: '#1E2246', stroke: '#7FD6E6', 'stroke-width': 3 }, root);
    prepDraw(s2.body);
    s2.die = S('rect', { x: 595, y: 285, width: 90, height: 90, rx: 8, fill: 'none', stroke: '#F2B544', 'stroke-width': 2.5 }, root);
    s2.cpu = S('text', { x: 640, y: 337, 'text-anchor': 'middle', class: 'mono', 'font-size': 18, fill: '#ECE8F6' }, root);
    s2.cpu.textContent = 'CPU';
    s2.labels = LAB.map(([txt, x, y, a]) => {
      const t = S('text', { x, y, 'text-anchor': a, class: 'serif', 'font-size': 23, fill: '#ECE8F6' }, root);
      t.textContent = txt; return t;
    });
    let w = 'M150,516';
    for (let i = 0; i < 4; i++) w += ' h15 v-18 h15 v18';
    w += ' h15';
    s2.wave = S('path', { d: w, fill: 'none', stroke: '#7FD6E6', 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, root);
    prepDraw(s2.wave);
    s2.bin1 = S('text', { x: 150, y: 120, class: 'mono', 'font-size': 18, fill: '#7FD6E6', opacity: .75 }, root);
    s2.bin2 = S('text', { x: 960, y: 120, class: 'mono', 'font-size': 18, fill: '#7FD6E6', opacity: .75 }, root);
  }
  function render2(lt) {
    const b = seg(lt, .3, 1.5);
    draw(s2.body, b); s2.body.style.fillOpacity = b;
    op(s2.die, seg(lt, 1, 1.8)); op(s2.cpu, seg(lt, 1.2, 2)); op(s2.pins, seg(lt, 1.2, 1.8) * .7);

    { id: 's5', name: 'Competitive programming', dur: 9.5, render: render5, caps: [[.6, 4.6, 'In competitive programming, every bit of knowledge I picked up felt like a small win.'], [4.9, 9.2, "Other people's solutions kept teaching me new tricks for writing efficient algorithms."]] },
    { id: 's6', name: 'Building software', dur: 9.5, render: render6, caps: [[.6, 4.8, 'Then came development: APIs, software design, and frameworks.'], [5.1, 9.2, 'With every application I built, I set out to learn something new.']] },
    { id: 's7', name: 'Still learning', dur: 14, render: render7, caps: [[.6, 4.4, 'Every app, framework, and skill adds another light to the map.'], [4.7, 10.3, 'Yet it never feels like enough. There is always more and more to learn.']] }
  ];
  let acc = 0;
  SCENES.forEach(s => { s.start = acc; acc += s.dur; s.el = $(s.id); });
  const TOTAL = acc;
  const CAPS = [];
  SCENES.forEach(s => s.caps.forEach(([a, b, text]) => CAPS.push({ a: s.start + a, b: s.start + b, text })));

  init1(); init2(); init3(); init4(); init5(); init6(); init7();

  const capEl = $('caption'), playBtn = $('play');

  function render(t) {
    renderStars(t);
    SCENES.forEach((s, i) => {
      const lt = t - s.start;
      const last = i === SCENES.length - 1;
      const visible = lt >= 0 && (lt < s.dur || (last && lt <= s.dur + .001));
      if (!visible) { s.el.style.display = 'none'; return; }
      s.el.style.display = 'inline';
      let a = 1;
      if (i > 0) a = Math.min(a, lin(lt, 0, .6));
      if (!last) a = Math.min(a, 1 - lin(lt, s.dur - .6, s.dur));
      op(s.el, a);
      s.render(Math.min(lt, s.dur));
    });
    const c = CAPS.find(c => t >= c.a && t < c.b);
    if (c) {
      if (capEl.textContent !== c.text) capEl.textContent = c.text;
      op(capEl, Math.min(lin(t, c.a, c.a + .45), 1 - lin(t, c.b - .45, c.b)));
    } else op(capEl, 0);
  }

  // Soundtrack: synthesized pad + bell arpeggio, one chord per scene (MIDI notes)
  const CHORDS = [
    [57, 60, 64, 67], // Am7
    [53, 57, 60, 64], // Fmaj7
    [48, 55, 59, 64], // Cmaj7
    [55, 59, 62, 64], // G6
    [52, 55, 59, 62], // Em7
    [53, 57, 60, 67], // Fadd9
    [48, 55, 62, 64]  // Cadd9
  ];
  const STEP = .5, ARP = [0, 1, 2, 3, 2, 1];
  const hz = m => 440 * 2 ** ((m - 69) / 12);
  const soundBtn = $('sound');
  let ctx = null, master, bus, stopPad = null, padScene = -1, lastStep = -1, soundOn = true;
  try {
    ctx = new AudioContext();
    master = ctx.createGain(); master.gain.value = 0;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    const delay = ctx.createDelay(); delay.delayTime.value = .45;
    const fb = ctx.createGain(); fb.gain.value = .35;
    bus = ctx.createGain();
    bus.connect(lp); bus.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(lp);
    lp.connect(master); master.connect(ctx.destination);
  } catch { ctx = null; }

  function startPad(notes) {
    const now = ctx.currentTime, g = ctx.createGain();
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(.035, now + 2);
    g.connect(bus);
    const oscs = notes.flatMap(m => [-5, 5].map(d => {
      const o = ctx.createOscillator();
      o.type = 'triangle'; o.frequency.value = hz(m - 12); o.detune.value = d;
      o.connect(g); o.start(now);
      return o;
    }));
    return () => {
      const t0 = ctx.currentTime;
      g.gain.cancelScheduledValues(t0);
      g.gain.setValueAtTime(g.gain.value, t0);
      g.gain.linearRampToValueAtTime(0, t0 + 1.5);
      oscs.forEach(o => o.stop(t0 + 1.6));
    };
  }
  function bell(m) {
    const now = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = hz(m);
    g.gain.setValueAtTime(0, now);
    g.gain.linearRampToValueAtTime(.1, now + .01);
    g.gain.exponentialRampToValueAtTime(.001, now + 1.8);
    o.connect(g); g.connect(bus); o.start(now); o.stop(now + 1.9);
  }
  function sound(t) {
    if (!ctx || !playing || !soundOn || ctx.state !== 'running') return;
    const i = SCENES.findIndex(s => t < s.start + s.dur);
    if (i < 0) return;
    if (i !== padScene) { if (stopPad) stopPad(); stopPad = startPad(CHORDS[i]); padScene = i; }
    const step = Math.floor(t / STEP);
    if (step !== lastStep) { lastStep = step; bell(CHORDS[i][ARP[step % ARP.length]] + 12); }
  }
  function updateGain() {
    if (!ctx) return;
    const on = playing && soundOn;
    // Long tail when the story ends, quick fade on pause
    master.gain.setTargetAtTime(on ? .8 : 0, ctx.currentTime, on ? .3 : t >= TOTAL ? 1.5 : .05);
  }
  function drawSoundBtn() {
    const on = soundOn && ctx.state === 'running';
    const label = on ? 'Mute' : 'Sound on';
    soundBtn.setAttribute('aria-label', label);
    soundBtn.title = label;
    soundBtn.innerHTML = on
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';
  }
  if (ctx) {
    ctx.onstatechange = drawSoundBtn;
    drawSoundBtn();
    // Browsers may block audio until a user gesture; unlock on the first one
    const unlock = () => { if (soundOn && ctx.state !== 'running') ctx.resume(); };
    addEventListener('pointerdown', unlock);
    addEventListener('keydown', unlock);
    soundBtn.addEventListener('click', () => {
      soundOn = !(soundOn && ctx.state === 'running');
      if (soundOn) ctx.resume();
      updateGain();
      drawSoundBtn();
    });
  } else soundBtn.hidden = true;

  let t = 0, playing = !reduceMotion, last = null;
  function setPlaying(v) {
    playing = v;
    if (v && t >= TOTAL) t = 0;
    const label = v ? 'Pause' : 'Play';
    playBtn.setAttribute('aria-label', label);
    playBtn.title = label;
    playBtn.innerHTML = v
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"/></svg>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>';
    updateGain();
  }
  setPlaying(playing);
  playBtn.addEventListener('click', () => setPlaying(!playing));
  $('reset').addEventListener('click', () => { t = 0; setPlaying(false); render(0); });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' && !(e.target instanceof HTMLButtonElement) && !(e.target instanceof HTMLInputElement)) { e.preventDefault(); setPlaying(!playing); }
  });

  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min(.1, (now - last) / 1000);
    last = now;
    if (playing) {
      t += dt;
      if (t >= TOTAL) { t = TOTAL; setPlaying(false); }
    }
    render(t);
    sound(t);
    requestAnimationFrame(frame);
  }
  render(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
